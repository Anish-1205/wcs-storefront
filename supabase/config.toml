# Supabase local dev configuration.
# Run `supabase start` to spin up the local stack, then `supabase db reset`
# to apply migrations in supabase/migrations.

project_id = "saree-website"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = false   # single admin account; create via dashboard or admin API — see docs/setup.md

[auth.email]
# `enabled` + this `enable_signup` together gate the email/password provider
# itself (i.e. whether anyone can sign IN) on current Supabase CLI versions —
# distinct from `[auth] enable_signup` above, which only gates public
# self-registration. Both must stay as set here or local admin login breaks;
# self-signup stays blocked via `[auth] enable_signup = false`.
enabled = true
enable_signup = true
enable_confirmations = false
