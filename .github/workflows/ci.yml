name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # `next build` prerenders the file-driven storefront and needs no real
  # backend. These placeholders satisfy the client bundles that read
  # NEXT_PUBLIC_* at build time; nothing here contacts a live service.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
  NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: placeholder-cloud
  CLOUDINARY_API_KEY: placeholder-key
  CLOUDINARY_API_SECRET: placeholder-secret
  NEXT_PUBLIC_WHATSAPP_NUMBER: "919876543210"
  NEXT_PUBLIC_BUSINESS_NAME: Weavers Club Sarees
  NEXT_PUBLIC_SITE_URL: https://example.com
  ADMIN_EMAILS: admin@example.com
  UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
  UPSTASH_REDIS_REST_TOKEN: placeholder-token
  # Never upload source maps / create releases from CI.
  SENTRY_AUTH_TOKEN: ""
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # T6.5: the stages run in parallel. "Lint, types, unit tests, build" is kept
  # as the job name branch protection requires (T1.12); it now only gathers the
  # others, and fails unless every one of them succeeded. It runs even when one
  # failed (if: always()), because a skipped job would count as a pass.

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Gates on known CVEs in shipped dependencies. Scoped to production
      # dependencies and to high/critical: dev-only tooling (lighthouse,
      # ffmpeg-static and friends) never reaches a user, and failing the build
      # on a low-severity transitive advisory would train everyone to ignore
      # this step. Dependabot still raises the version-bump PRs separately.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  static:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run types

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Production build
        run: npm run build

  verify:
    name: Lint, types, unit tests, build
    if: always()
    needs: [audit, static, unit, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A stage failed, was cancelled or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::not every stage succeeded: ${{ toJSON(needs.*.result) }}"
          exit 1

      - name: Every stage passed
        run: echo "audit, lint and types, unit tests and build all passed"
